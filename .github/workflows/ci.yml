name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Standalone syntax smoke check. The host half imports the host-provided
      # @deepseek-ai/* framework (dsh-tools → cordis → …), which a clean runner
      # can't install (peer-dependency chains plus version-mismatched rc ranges),
      # so the full unit tests only run inside a DSH host. `node --check`
      # validates bundle syntax here and needs no dependencies at all.
      - run: |
          for f in lib/*.js; do node --check "$f" || exit 1; done
          echo "syntax check passed"
